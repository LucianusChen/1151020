
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人網站</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #111827, #374151);
      text-align: center;
      padding: 24px;
    }

    .profile {
      max-width: 600px;
    }

    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 8px 24px #0004;
    }

    h1 {
      margin: 24px 0 10px;
      font-size: 2.4rem;
    }

    p {
      color: #d1d5db;
      line-height: 1.8;
    }

    .links {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .links a {
      color: #111827;
      background: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .links a:hover {
      background: #93c5fd;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 64px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <main class="profile">
    <img src="me.jpg" alt="我的個人照片" class="avatar">

    <h1>你的名字</h1>

    <p>Hello! 歡迎來到我的個人網站。</p>
    <p>這裡可以放置個人介紹、興趣、作品與聯絡資訊。</p>

    <nav class="links">
      <a href="#about">關於我</a>
      <a href="mailto:you@example.com">聯絡我</a>
    </nav>

    <section id="about">
      <h2>About Me</h2>
      <p>在這裡寫下你的個人簡介。</p>
    </section>
  </main>

  <footer>
    &copy; 2026 你的名字. All rights reserved.
  </footer>

</body>
</html>
